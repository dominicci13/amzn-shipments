[pytest]
# pytest-html 2.0.1 imports pkg_resources, which setuptools 82 removed, and
# seleniumbase's plugin then reads pytest-html's --html option. The tests use
# neither plugin, so both are disabled rather than pinning setuptools back.
# The breakage is environment-wide, not specific to this repo.
addopts = -p no:html -p no:seleniumbase
